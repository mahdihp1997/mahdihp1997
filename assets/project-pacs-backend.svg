<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">PACS Server Backend</title>
  <desc id="desc">Custom project card for Mahdi Hosseinpour's Java PACS and DICOM backend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#071B16"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="0.5" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="70%">
      <stop offset="0" stop-color="#238636" stop-opacity=".24"/>
      <stop offset="1" stop-color="#238636" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#3FB950" stroke-opacity=".04"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="756" height="266" rx="24" fill="url(#bg)" stroke="url(#stroke)" stroke-width="2"/>
  <rect x="2" y="2" width="756" height="266" rx="24" fill="url(#grid)"/>
  <rect x="2" y="2" width="756" height="266" rx="24" fill="url(#glow)"/>

  <rect x="26" y="24" width="112" height="30" rx="15" fill="#238636" fill-opacity=".16" stroke="#3FB950" stroke-opacity=".42"/>
  <text x="82" y="44" text-anchor="middle" fill="#56D364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">FEATURED</text>

  <text x="28" y="100" fill="#F0F6FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">⚙️ PACS Server Backend</text>
  <text x="29" y="132" fill="#8B949E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Java-based DICOM/PACS server with database integration and REST APIs.</text>
  <text x="29" y="157" fill="#8B949E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Designed for reliable ingest, storage, query and image delivery workflows.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">
    <g transform="translate(28,190)"><rect width="92" height="34" rx="17" fill="#161B22" stroke="#30363D"/><text x="46" y="22" text-anchor="middle" fill="#C9D1D9">Java 17</text></g>
    <g transform="translate(130,190)"><rect width="102" height="34" rx="17" fill="#161B22" stroke="#30363D"/><text x="51" y="22" text-anchor="middle" fill="#C9D1D9">dcm4che</text></g>
    <g transform="translate(242,190)"><rect width="122" height="34" rx="17" fill="#161B22" stroke="#30363D"/><text x="61" y="22" text-anchor="middle" fill="#C9D1D9">PostgreSQL</text></g>
    <g transform="translate(374,190)"><rect width="94" height="34" rx="17" fill="#161B22" stroke="#30363D"/><text x="47" y="22" text-anchor="middle" fill="#C9D1D9">Javalin</text></g>
  </g>

  <g transform="translate(586,72)">
    <rect x="18" y="20" width="108" height="86" rx="14" fill="#0A1511" stroke="#3FB950" stroke-opacity=".5"/>
    <rect x="34" y="38" width="76" height="10" rx="5" fill="#3FB950" fill-opacity=".35"/>
    <rect x="34" y="58" width="54" height="8" rx="4" fill="#58A6FF" fill-opacity=".32"/>
    <rect x="34" y="76" width="66" height="8" rx="4" fill="#3FB950" fill-opacity=".28"/>
    <circle cx="116" cy="34" r="6" fill="#56D364" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M72 106V129M50 129H94" stroke="#56D364" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="596" y="228" fill="#56D364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">OPEN REPOSITORY →</text>

  <rect x="0" y="0" width="95" height="3" rx="2" fill="#56D364">
    <animate attributeName="x" values="20;645;20" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".2;.95;.2" dur="6.5s" repeatCount="indefinite"/>
  </rect>
</svg>