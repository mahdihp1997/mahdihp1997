<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Mahdi Hosseinpour — Backend Java Developer</title>
  <desc id="desc">Dark professional developer banner focused on Health IT, DICOM and PACS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="0.52" stop-color="#0D1726"/>
      <stop offset="1" stop-color="#07111D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0F6FC"/>
      <stop offset="0.38" stop-color="#79C0FF"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="48%" r="42%">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#58A6FF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1500" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1500" height="500" rx="28" fill="url(#grid)"/>
  <rect width="1500" height="500" rx="28" fill="url(#glow)"/>

  <circle cx="1210" cy="140" r="118" fill="#1F6FEB" opacity=".06"/>
  <circle cx="1272" cy="218" r="82" fill="#58A6FF" opacity=".045"/>
  <path d="M970 380C1085 300 1180 416 1295 318S1430 356 1500 286" fill="none" stroke="#58A6FF" stroke-opacity=".3" stroke-width="2"/>
  <path d="M910 413C1020 360 1120 448 1212 386S1360 397 1500 345" fill="none" stroke="#2F81F7" stroke-opacity=".15" stroke-width="1.5"/>
  <g fill="#79C0FF">
