<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Mahdi Hosseinpour — Backend Java Developer</title>
  <desc id="desc">Animated dark developer banner focused on Health IT, DICOM and PACS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="0.52" stop-color="#0D1726"/>
      <stop offset="1" stop-color="#07111D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0F6FC"/>
      <stop offset="0.38" stop-color="#79C0FF"/>
      <stop offset="1" stop-color="#2F81F7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.12 0;0.12 0;-0.12 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="48%" r="42%">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity=".28">
        <animate attributeName="stop-opacity" values=".16;.34;.16" dur="4.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#79C0FF" stop-opacity=".20"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#58A6FF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1500" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1500" height="500" rx="28" fill="url(#grid)"/>
  <rect width="1500" height="500" rx="28" fill="url(#glow)"/>

  <rect x="-280" y="0" width="280" height="500" fill="url(#scan)" filter="url(#blur)" opacity=".85">
    <animate attributeName="x" values="-280;1500" dur="7s" repeatCount="indefinite"/>
  </rect>

  <circle cx="1210" cy="140" r="118" fill="#1F6FEB" opacity=".06">
    <animate attributeName="r" values="108;126;108" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".035;.085;.035" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1272" cy="218" r="82" fill="#58A6FF" opacity=".045">
    <animate attributeName="r" values="74;91;74" dur="4.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".025;.07;.025" dur="4.7s" repeatCount="indefinite"/>
  </circle>

  <path d="M970 380C1085 300 1180 416 1295 318S1430 356 1500 286" fill="none" stroke="#58A6FF" stroke-opacity=".3" stroke-width="2" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" values="0;-88" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M910 413C1020 360 1120 448 1212 386S1360 397 1500 345" fill="none" stroke="#2F81F7" stroke-opacity=".15" stroke-width="1.5" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;80" dur="5.5s" repeatCount="indefinite"/>
  </path>

  <g fill="#79C0FF">
    <circle cx="1008" cy="355" r="4" opacity=".75"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="389" r="4" opacity=".65"><animate attributeName="opacity" values=".2;.95;.2" dur="2.8s" begin=".45s" repeatCount="indefinite"/></circle>
    <circle cx="1210" cy="377" r="4" opacity=".75"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" begin=".9s" repeatCount="indefinite"/></circle>
    <circle cx="1318" cy="331" r="4" opacity=".6"><animate attributeName="opacity" values=".2;.9;.2" dur="2.8s" begin="1.35s" repeatCount="indefinite"/></circle>
    <circle cx="1422" cy="353" r="4" opacity=".55"><animate attributeName="opacity" values=".18;.85;.18" dur="2.8s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity=".5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="1018" y="115" fill="#58A6FF">public class HealthService {</text>
    <text x="1050" y="148" fill="#C9D1D9">Patient findById(...)</text>
    <text x="1050" y="181" fill="#7EE787">// code · data · health</text>
    <text x="1018" y="214" fill="#58A6FF">}</text>
    <rect x="1217" y="133" width="8" height="20" rx="2" fill="#7EE787">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="58" y="54" width="6" height="88" rx="3" fill="#2F81F7">
    <animate attributeName="height" values="72;88;72" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="62;54;62" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <text x="86" y="78" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="7">BACKEND • HEALTH IT • MEDICAL IMAGING</text>

  <text x="78" y="218" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">Mahdi Hosseinpour</text>
  <text x="82" y="270" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">Backend Java Developer  |  Health IT  |  DICOM / PACS</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">
    <g transform="translate(80,316)"><rect width="108" height="52" rx="26" fill="#0D1117" stroke="#2F81F7" stroke-opacity=".62"><animate attributeName="stroke-opacity" values=".42;1;.42" dur="4s" begin="0s" repeatCount="indefinite"/></rect><text x="54" y="33" text-anchor="middle" fill="#F0F6FC">Java</text></g>
    <g transform="translate(202,316)"><rect width="162" height="52" rx="26" fill="#0D1117" stroke="#2F81F7" stroke-opacity=".62"><animate attributeName="stroke-opacity" values=".42;1;.42" dur="4s" begin=".45s" repeatCount="indefinite"/></rect><text x="81" y="33" text-anchor="middle" fill="#F0F6FC">PostgreSQL</text></g>
    <g transform="translate(378,316)"><rect width="158" height="52" rx="26" fill="#0D1117" stroke="#2F81F7" stroke-opacity=".62"><animate attributeName="stroke-opacity" values=".42;1;.42" dur="4s" begin=".9s" repeatCount="indefinite"/></rect><text x="79" y="33" text-anchor="middle" fill="#F0F6FC">Spring Boot</text></g>
    <g transform="translate(550,316)"><rect width="108" height="52" rx="26" fill="#0D1117" stroke="#2F81F7" stroke-opacity=".62"><animate attributeName="stroke-opacity" values=".42;1;.42" dur="4s" begin="1.35s" repeatCount="indefinite"/></rect><text x="54" y="33" text-anchor="middle" fill="#F0F6FC">React</text></g>
    <g transform="translate(672,316)"><rect width="118" height="52" rx="26" fill="#0D1117" stroke="#2F81F7" stroke-opacity=".62"><animate attributeName="stroke-opacity" values=".42;1;.42" dur="4s" begin="1.8s" repeatCount="indefinite"/></rect><text x="59" y="33" text-anchor="middle" fill="#F0F6FC">Next.js</text></g>
  </g>

  <text x="82" y="433" fill="#6E7681" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="6">CLEAN CODE  •  RELIABLE SYSTEMS  •  MEANINGFUL IMPACT</text>
  <rect x="82" y="452" width="94" height="4" rx="2" fill="#2F81F7">
    <animate attributeName="width" values="94;230;94" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".75;1;.75" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
